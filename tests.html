<script>
const out = document.getElementById('out');
let passed = 0, failed = 0;
const approx = (a,b,eps=0.5) => Math.abs(a-b) <= eps;
function group(name){ const d=document.createElement('div'); d.className='grp'; d.textContent=name; out.appendChild(d); }
function check(name, cond, detail){
  const d = document.createElement('div');
  d.className = 'case ' + (cond ? 'pass' : 'fail');
  d.innerHTML = name + (detail ? ` <span class="detail">— ${detail}</span>` : '');
  out.appendChild(d);
  cond ? passed++ : failed++;
}

const C = LedgerCore, T = LedgerCore.ternary;

// ---- nutrientsFrom: USDA energy pick ----
group('nutrientsFrom — energy field selection');
(function(){
  const food = { foodNutrients:[
    {nutrientNumber:'208', value:5}, {nutrientNumber:'957', value:73.5},
    {nutrientNumber:'203', value:1.9}, {nutrientNumber:'204', value:0.1}, {nutrientNumber:'205', value:17}
  ]};
  const n = C.nutrientsFrom(food);
  check('prefers Atwater #957 over bogus #208', approx(n.kcal, 73.5), `got ${n.kcal}`);

  const food2 = { foodNutrients:[
    {nutrientNumber:'208', value:5},
    {nutrientNumber:'203', value:1.9}, {nutrientNumber:'204', value:0.1}, {nutrientNumber:'205', value:17}
  ]};
  const n2 = C.nutrientsFrom(food2);         // no Atwater, #208=5 is < half of macro est (76.5) → trust macros
  check('macro safety net overrides implausible #208', approx(n2.kcal, 76.5), `got ${n2.kcal}`);

  const food3 = { foodNutrients:[
    {nutrientNumber:'208', value:165},
    {nutrientNumber:'203', value:31}, {nutrientNumber:'204', value:3.6}, {nutrientNumber:'205', value:0}
  ]};
  const n3 = C.nutrientsFrom(food3);
  check('uses plausible #208 when no Atwater present', approx(n3.kcal, 165), `got ${n3.kcal}`);

  // Micronutrients: 291 fiber(g), 269 sugars(g), 307 sodium(mg).
  const food4 = { foodNutrients:[
    {nutrientNumber:'208', value:165}, {nutrientNumber:'203', value:31},
    {nutrientNumber:'291', value:2.5}, {nutrientNumber:'269', value:1.2}, {nutrientNumber:'307', value:400}
  ]};
  const n4 = C.nutrientsFrom(food4);
  check('extracts fiber/sugar/sodium', n4.fib===2.5 && n4.sug===1.2 && n4.na===400, `got fib${n4.fib} sug${n4.sug} na${n4.na}`);
  check('missing micros default to 0', C.nutrientsFrom({foodNutrients:[{nutrientNumber:'208',value:100}]}).fib===0, '');
})();

// ---- target resolution ----
group('resolvePTarget / capGrams');
check('protein 30% of 1700 kcal floor = 127.5g', approx(C.resolvePTarget({mode:'pct',val:30}, 1700), 127.5), '');
check('protein grams mode passes through', C.resolvePTarget({mode:'g',val:120}, 1700) === 120, '');
check('carb cap 40% of 1700 @4kcal/g = 170g', approx(C.capGrams({mode:'pct',val:40}, 4, 1700), 170), '');
check('cap of 0 = off', C.capGrams({mode:'g',val:0}, 9, 1700) === 0, '');

// ---- completeMacros: set two, the third is arithmetic ----
group('completeMacros — fill the blank macro from the calorie floor');
(function(){
  const M = (mode,val)=>({mode,val});
  const at = (floor,p,c,f)=> C.completeMacros(floor, {p:p, c:c, f:f});

  // Two in grams → the blank one in grams, at its own kcal/g.
  const r1 = at(2000, M('g',150), M('g',200), M('g',0));    // 600 + 800 used, 600 left
  check('p150g + c200g @2000 → fat', r1 && r1.key==='f' && r1.val===67, JSON.stringify(r1));
  check('  …kcal reported from the ROUNDED grams', r1.kcal===603, `got ${r1.kcal}`);
  const r2 = at(2000, M('g',150), M('g',0), M('g',60));      // 600 + 540 used, 860 left
  check('p150g + f60g @2000 → carbs 215g', r2 && r2.key==='c' && r2.val===215, JSON.stringify(r2));
  const r3 = at(2000, M('g',0), M('g',200), M('g',60));
  check('c200g + f60g @2000 → protein 165g', r3 && r3.key==='p' && r3.val===165, JSON.stringify(r3));

  // Percentages: the three shares must come to 100 for the floor to be fully spent.
  const r4 = at(2000, M('pct',30), M('pct',40), M('pct',0));
  check('30% + 40% → fat 30%', r4 && r4.mode==='pct' && r4.val===30, JSON.stringify(r4));
  const r5 = at(1800, M('pct',35), M('pct',45), M('pct',0));
  check('35% + 45% → fat 20% (sums to 100)', r5.val===20 && 35+45+r5.val===100, JSON.stringify(r5));

  // The answer is expressed in the BLANK field's unit, not the units of the inputs.
  const r6 = at(2000, M('g',150), M('g',200), M('pct',0));
  check('grams in, % field out → 30%', r6.mode==='pct' && r6.val===30, JSON.stringify(r6));

  // Nothing to infer.
  check('one macro set → null', at(2000, M('g',150), M('g',0), M('g',0))===null, 'expected null');
  check('no macro set → null', at(2000, M('g',0), M('g',0), M('g',0))===null, 'expected null');
  check('all three set → null (never overwrite a deliberate value)',
        at(2000, M('g',150), M('g',200), M('g',67))===null, 'expected null');
  check('no floor → null', at(0, M('g',150), M('g',200), M('g',0))===null, 'expected null');

  // Over-budget must not fill in a 0, which would read as a deliberate "none".
  const o1 = at(2000, M('g',200), M('g',350), M('g',0));     // 800 + 1400 = 2200
  check('two macros over the floor → over flag', o1 && o1.over===true && o1.val===0, JSON.stringify(o1));
  check('  …and reports what they already spend', o1.used===2200, `got ${o1.used}`);
  const o2 = at(2000, M('g',150), M('g',350), M('g',0));     // 600 + 1400 = exactly 2000
  check('two macros exactly filling the floor → over flag', o2 && o2.over===true, JSON.stringify(o2));
  // Rounding down to zero grams is the same situation, not a 0g target.
  const o3 = at(2000, M('g',150), M('g',349), M('g',0));     // 4 kcal left → 0.4g fat
  check('a remainder that rounds to 0g → over flag', o3 && o3.over===true, JSON.stringify(o3));

  // macroKcal, the primitive underneath.
  check('macroKcal: 150g protein = 600 kcal', C.macroKcal(M('g',150), 4, 2000)===600, '');
  check('macroKcal: 60g fat = 540 kcal', C.macroKcal(M('g',60), 9, 2000)===540, '');
  check('macroKcal: 30% of 2000 = 600 kcal', C.macroKcal(M('pct',30), 4, 2000)===600, '');
  check('macroKcal: unset = 0', C.macroKcal(M('g',0), 4, 2000)===0, '');
})();

// ---- computeEntry: penalties ----
group('computeEntry — unweighed penalties');
const PEN = {inflate:1.1, deduct:0.9};
const chk = {kcal:165, p:31, f:3.6, c:0};
(function(){
  const w = C.computeEntry('Chicken', 150, true, chk, 'DB', PEN);
  check('weighed 150g chicken: 247.5 kcal', approx(w.kcal, 247.5), `got ${w.kcal.toFixed(1)}`);
  check('weighed 150g chicken: 46.5g P', approx(w.p, 46.5), `got ${w.p.toFixed(1)}`);
  check('weighed entry carries no flags', w.flags.length === 0, '');

  const u = C.computeEntry('Chicken', 150, false, chk, 'DB', PEN);
  check('unweighed +10% kcal = 272.25', approx(u.kcal, 272.25), `got ${u.kcal.toFixed(2)}`);
  check('unweighed −10% P = 41.85', approx(u.p, 41.85), `got ${u.p.toFixed(2)}`);
  // The oil tax is gone: fat is whatever the food's own base says, never a surcharge.
  // Absorbed cooking oil is logged as its own ingredient by the parser instead.
  check('unweighed leaves fat untouched', approx(u.f, 3.6*1.5), `got ${u.f.toFixed(2)}`);
  check('unweighed flags name only the two penalties', u.flags.length === 1, `got ${u.flags.length}`);

  // Micronutrients scale with grams like the macros; a legacy base without them → 0, never NaN.
  const micBase = {kcal:100, p:5, f:2, c:10, fib:2, sug:5, na:400};
  const mic = C.computeEntry('x', 150, true, micBase, 'DB', PEN);
  check('micros scale at 150g: fib 3, sug 7.5, na 600', approx(mic.fib,3)&&approx(mic.sug,7.5)&&approx(mic.na,600), `got fib${mic.fib} sug${mic.sug} na${mic.na}`);
  const legacy = C.computeEntry('x', 150, true, {kcal:100,p:5,f:2,c:10}, 'DB', PEN);
  check('legacy base without micros → 0 (no NaN)', legacy.fib===0 && legacy.sug===0 && legacy.na===0, '');

  // The dish an ingredient came from is kept on the entry. Without it, decomposing
  // "biryani" into six rows loses the biryani, and repeats can only ever offer rice.
  const comp = C.computeEntry('basmati rice', 180, false, chk, 'USDA', PEN, 'chicken biryani');
  check('partOf is carried onto the entry', comp.partOf === 'chicken biryani', `got ${comp.partOf}`);
  check('a plain food has no partOf key at all', !('partOf' in w));
  check('an empty dish name does not create the key',
        !('partOf' in C.computeEntry('x', 100, true, chk, 'DB', PEN, '')));
})();

// ---- solveFridge ----
group('normalizeDishComponents — one dish remains one card');
{
  const fixed=C.normalizeDishComponents([
    {name:'Rice, cooked, NFS',partOf:'pulao rice'},
    {name:'Chicken, broilers or fryers, breast, cooked',partOf:'chicken'},
    {name:'Vegetable oil, NFS',partOf:'pulao rice'}
  ]);
  check('a self-labelled ingredient joins the composite dish',fixed.every(x=>x.partOf==='pulao rice'),JSON.stringify(fixed));
  const separate=C.normalizeDishComponents([
    {name:'rice',partOf:'chicken biryani'},{name:'chicken',partOf:'chicken biryani'},
    {name:'yogurt',partOf:'raita'},{name:'cucumber',partOf:'raita'}
  ]);
  check('two real composite dishes remain separate',separate[2].partOf==='raita'&&separate[3].partOf==='raita',JSON.stringify(separate));
}

group('solveFridge — rice + chicken to floor');
const RICE = {kcal:130, p:2.7}, CHKf = {kcal:165, p:31};
const cfg = t => ({floor:1700, ceil:1900, pTarget:120, rice:RICE, chk:CHKf});
(function(){
  const s = C.solveFridge({kcal:1000, p:60}, cfg());
  check('exact-both solves (status ok)', s.status === 'ok', s.status);
  check('  → ~329g rice', approx(s.r, 329, 1), `got ${s.r.toFixed(1)}`);
  check('  → ~165g chicken', approx(s.k, 165, 1), `got ${s.k.toFixed(1)}`);
  check('  → protein lands ~120g', approx(s.vp, 120, 0.5), `got ${s.vp.toFixed(1)}`);

  const s2 = C.solveFridge({kcal:1000, p:115}, cfg());   // tiny protein gap ⇒ chicken-only branch
  check('chicken-only branch (rice=0)', s2.status === 'ok' && s2.r === 0, `r=${s2.r}`);
  check('  → ~424g chicken', approx(s2.k, 424, 1), `got ${s2.k.toFixed(1)}`);

  const s3 = C.solveFridge({kcal:1650, p:20}, cfg());     // small kcal gap, huge protein gap
  check('genuine conflict flagged', s3.status === 'conflict', s3.status);
  check('  → protein shortfall ~90.6g', approx(s3.shortfall, 90.6, 0.5), `got ${s3.shortfall.toFixed(1)}`);

  const s4 = C.solveFridge({kcal:1750, p:130}, cfg());    // already over floor
  check('floor already met → done', s4.status === 'done', s4.status);
})();

// ---- budgetCombos ----
group('budgetCombos — pair solver');
(function(){
  const foods = [['Chicken', {kcal:165,p:31}], ['Rice', {kcal:130,p:2.7}]];
  const combos = C.budgetCombos(foods, 500, 40);
  check('returns exactly one valid pair', combos.length === 1, `got ${combos.length}`);
  const c = combos[0];
  check('  → ~107g chicken', approx(c.gA, 107, 1), `got ${c.gA}`);
  check('  → ~248g rice', approx(c.gB, 248, 1), `got ${c.gB}`);
  check('  → lands ~500 kcal', approx(c.kcal, 500, 1), `got ${c.kcal}`);
  check('  → delivers ~40g protein', approx(c.p, 40, 1), `got ${c.p}`);
  check('  → not protein-penalised (score < 500)', c.score < 500, `score ${c.score.toFixed(1)}`);
})();

// ---- rankFoods: USDA candidate ranking ----
group('rankFoods — junk demotion, token boost, kcal plausibility');
(function(){
  const mk = (name,kcal)=>({name, base:{kcal, p:0, f:0, c:0}});
  // Junk demotion: dehydrated powder loses to the plain raw food even when USDA lists it first.
  const r1 = C.rankFoods([mk('Bananas, dehydrated, or banana powder',346), mk('Bananas, raw',89)], 'banana');
  check('raw banana beats dehydrated powder', r1[0].name==='Bananas, raw', `got ${r1[0].name}`);
  // Token boost: candidate containing every query word beats a keyword cousin.
  const r2 = C.rankFoods([mk('Wheat flour, whole-grain',340), mk('Wheat flour, white, all-purpose, enriched',364)], 'all purpose flour');
  check('all-query-words match outranks keyword cousin', r2[0].name.includes('all-purpose'), `got ${r2[0].name}`);
  // kcal plausibility: with an AI prior of ~880 kcal/100g, a 100 kcal "oil" sinks.
  const r3 = C.rankFoods([mk('Oil, plantain',100), mk('Oil, sunflower',884)], 'oil', 880);
  check('kcal prior sinks implausible candidate', r3[0].name==='Oil, sunflower', `got ${r3[0].name}`);
  // …but a mild deviation (165 vs est 200) must NOT override name quality.
  const r4 = C.rankFoods([mk('Chicken, breaded, fried',290), mk('Chicken, breast, raw',165)], 'chicken breast', 200);
  check('mild kcal deviation does not override name quality', r4[0].name==='Chicken, breast, raw', `got ${r4[0].name}`);
  // No prior + tied scores → USDA's original relevance order is preserved.
  const r5 = C.rankFoods([mk('Oil, plantain',100), mk('Oil, sunflower',884)], 'oil');
  check('no prior → USDA order kept on score tie', r5[0].name==='Oil, plantain', `got ${r5[0].name}`);
})();

// ---- defaultSelection: pick a plausible candidate, else fall back to the AI estimate ----
group('defaultSelection — reject a wrong top match, prefer the estimate');
(function(){
  const mk = (name,kcal)=>({name, base:{kcal, p:0, f:0, c:0}});
  // No candidates → the AI estimate is all we have.
  check('empty candidates → est', C.defaultSelection([], 250)==='est', 'expected est');
  // No prior → keep the top-ranked match (legacy behaviour).
  check('no prior → u0', C.defaultSelection([mk('Water',40)], 0)==='u0', 'expected u0');
  // Top match is plausible vs the prior → take it.
  check('plausible top → u0', C.defaultSelection([mk('Chapati',297), mk('Wheat flour',364)], 300)==='u0', 'expected u0');
  // Top match wildly off (chapati est ~300, top is a 40 kcal "water"), but a later
  // candidate lands near the prior → pick that candidate, not the wrong top one.
  check('wrong top, plausible later → that index',
    C.defaultSelection([mk('Water, bottled',40), mk('Chapati or roti',290)], 300)==='u1', 'expected u1');
  // Nothing lands near the prior → trust the AI estimate over a clearly-wrong match.
  check('no plausible candidate → est',
    C.defaultSelection([mk('Water',40), mk('Broth',12)], 300)==='est', 'expected est');
})();

// ---- Pinned USDA entries: chicken always resolves to the cooked breast ----
group('foodPin / applyPin — chicken pins to cooked breast, other cuts do not');
(function(){
  const mk = (name,kcal)=>({name, base:{kcal, p:0, f:0, c:0}});
  const RAW    = mk('Chicken, broilers or fryers, breast, meat only, raw', 114);
  const STEWED = mk('Chicken, broilers or fryers, breast, meat only, cooked, stewed', 151);
  const FRIED  = mk('Chicken, breaded, fried', 290);

  // --- which queries the pin claims ---
  const pinned = q => !!C.foodPin(q);
  check('"chicken breast" is pinned', pinned('chicken breast'), 'expected a pin');
  check('bare "chicken" is pinned', pinned('chicken'), 'expected a pin');
  check('"grilled chicken breast" is pinned', pinned('grilled chicken breast'), 'expected a pin');
  check('"Chicken Breast" (case) is pinned', pinned('Chicken Breast'), 'expected a pin');
  check('"chicken tikka" is pinned', pinned('chicken tikka'), 'expected a pin');
  check('"roasted chicken breast" is pinned', pinned('roasted chicken breast'), 'roasting is still breast meat');
  // Different cuts / preparations are genuinely different foods — the pin must not claim them.
  check('"chicken thigh" is NOT pinned', !pinned('chicken thigh'), 'thigh must rank normally');
  check('"chicken wings" is NOT pinned', !pinned('chicken wings'), 'wings must rank normally');
  check('"fried chicken" is NOT pinned', !pinned('fried chicken'), 'fried must rank normally');
  check('"ground chicken" is NOT pinned', !pinned('ground chicken'), 'ground must rank normally');
  check('"chicken liver" is NOT pinned', !pinned('chicken liver'), 'liver must rank normally');
  check('"chicken broth" is NOT pinned', !pinned('chicken broth'), 'broth must rank normally');
  check('non-chicken query has no pin', !pinned('basmati rice'), 'expected no pin');

  // --- the pin beats the ranker, which on its own prefers raw ---
  const ranked = C.rankFoods([RAW, FRIED, STEWED], 'chicken breast', 165);
  check('ranker alone still floats RAW to the top', ranked[0].name===RAW.name, `got ${ranked[0].name}`);
  const pin = C.foodPin('chicken breast');
  const withPin = C.applyPin(ranked, pin);
  check('applyPin moves the cooked breast to the front', withPin[0].name===STEWED.name, `got ${withPin[0].name}`);
  check('applyPin keeps every other candidate', withPin.length===3, `got ${withPin.length}`);
  check('applyPin does not drop the raw entry', withPin.some(f=>f.name===RAW.name), 'raw entry lost');

  // USDA carries several cooked variants of the very same cut. The pin names one method,
  // so it must not settle for a sibling that merely happens to rank higher.
  (function(){
    const ROAST = mk('Chicken, broilers or fryers, breast, meat only, cooked, roasted', 165);
    const both  = C.applyPin([ROAST, RAW, STEWED], pin);
    check('cooked-but-roasted does not satisfy the stewed pin', !C.pinMatches(ROAST, pin), 'roasted matched');
    check('pin picks stewed over roasted', both[0].name===STEWED.name, `got ${both[0].name}`);
    check('  …and selection agrees', C.defaultSelection(both, 165, pin)==='u0', 'expected u0');
  })();

  // --- defaultSelection honours the pin regardless of list position or the kcal prior ---
  check('pin wins from a non-zero index', C.defaultSelection(ranked, 165, pin)==='u1', 'expected u1');
  check('pin wins after applyPin', C.defaultSelection(withPin, 165, pin)==='u0', 'expected u0');
  // The whole point of a hardcoded pin: a bad AI estimate can no longer veto it. An est of
  // 400 kcal is >1.8x off 151, which without the pin would reject the cooked entry outright.
  check('pin overrides an implausible AI estimate',
    C.defaultSelection([STEWED, FRIED], 400, pin)==='u0', 'expected u0');
  check('  …and without the pin that same list does not pick it',
    C.defaultSelection([STEWED, FRIED], 400)!=='u0', 'expected the pin to be what made the difference');
  // Pin present but USDA never returned the entry → fall back to normal behaviour, never invent.
  check('pin absent from results → normal selection', C.defaultSelection([RAW, FRIED], 120, pin)==='u0', 'expected u0');
  check('applyPin with no match leaves order alone', C.applyPin([RAW, FRIED], pin)[0].name===RAW.name, 'order changed');
  check('applyPin with no pin is a no-op', C.applyPin([RAW, FRIED], null)[0].name===RAW.name, 'order changed');
  check('applyPin tolerates an empty list', C.applyPin([], pin).length===0, 'expected []');
  check('defaultSelection with pin but no candidates → est', C.defaultSelection([], 165, pin)==='est', 'expected est');
})();

// ---- fatEstimate: energy-balance body-fat change over a maintenance band ----
group('fatEstimate — 7700 kcal ≈ 1 kg, maintenance as a band');
(function(){
  const e = C.fatEstimate([3000,3000], 2200, 2400);
  check('n and sum', e.n===2 && e.sum===6000, `got n${e.n} sum${e.sum}`);
  check('low maintenance bound gives the larger surplus', e.kcalHigh===1600 && e.kcalLow===1200, `got ${e.kcalLow}..${e.kcalHigh}`);
  check('kg span = kcal / 7700', Math.abs(e.kgHigh-1600/7700)<1e-9 && Math.abs(e.kgLow-1200/7700)<1e-9, `got ${e.kgLow}..${e.kgHigh}`);
  // Deficit → negative (fat lost); bounds passed unordered must still resolve.
  const d = C.fatEstimate([1800,2000,1900], 2400, 2200);
  check('deficit yields negative kcal (fat lost)', d.kcalHigh===-900 && d.kcalLow===-1500, `got ${d.kcalLow}..${d.kcalHigh}`);
  const z = C.fatEstimate([], 2200, 2400);
  check('empty run → zeros', z.n===0 && z.sum===0 && z.kcalLow===0 && z.kcalHigh===0, `got n${z.n}`);
})();

// ---- bmrMifflin + calibrateTDEE: resting burn and adaptive maintenance ----
group('TDEE — Mifflin-St Jeor BMR and data calibration');
(function(){
  check('male 80kg/180cm/30y = 1780', C.bmrMifflin('male',80,180,30)===1780, `got ${C.bmrMifflin('male',80,180,30)}`);
  check('female 60kg/165cm/30y = 1320.25', approx(C.bmrMifflin('female',60,165,30),1320.25), `got ${C.bmrMifflin('female',60,165,30)}`);
  check('missing weight → 0', C.bmrMifflin('male',0,180,30)===0, '');
  check('moderate TDEE = BMR×1.55 = 2759', approx(C.bmrMifflin('male',80,180,30)*1.55,2759), '');
  // No usable weight trend → formula only.
  const c0 = C.calibrateTDEE(2400, 0, null, 0);
  check('no data → blended = formula 2400, dataTDEE null, w 0', c0.blended===2400 && c0.dataTDEE===null && c0.w===0, JSON.stringify(c0));
  // Losing 0.2 kg/wk at 2300 kcal ⇒ maintenance 2520; 28 days → fully calibrated.
  const c1 = C.calibrateTDEE(2400, 2300, -0.2, 28);
  check('full calibration (28d): dataTDEE 2520, w 1, blended 2520', c1.dataTDEE===2520 && c1.w===1 && c1.blended===2520, JSON.stringify(c1));
  // Gaining 0.1 kg/wk at 2500 ⇒ 2390; 17 days → half-weighted blend 2395.

group('supplementWindow + supplementStats');
(function(){
  const alt = {every:2, anchor:'2026-07-01', mode:'fixed'};
  // ON days in 1–7 July: 1,3,5,7. Took 1 and 3, missed 5, 7 is the open day on screen.
  const taken = {'2026-07-01':true, '2026-07-03':true};
  const cells = C.supplementWindow(alt, taken, '2026-07-07', 7);
  check('window is 7 cells ending on the view date',
        cells.length === 7 && cells[6].date === '2026-07-07', `got ${cells.length}`);
  check('marks the right days ON', cells.filter(c=>c.due).length === 4, `got ${cells.filter(c=>c.due).length}`);
  const st = C.supplementStats(cells);
  check('counts 4 due, 2 taken, 2 missed', st.due===4 && st.taken===2 && st.missed===2,
        `got due ${st.due}, taken ${st.taken}, missed ${st.missed}`);
  check('adherence rate is 50%', approx(st.rate, 0.5, 0.001), `got ${st.rate}`);

  // Perfect run whose final ON day is the still-open day on screen: it must not break the streak.
  const perfect = C.supplementWindow(alt, {'2026-07-01':true,'2026-07-03':true,'2026-07-05':true}, '2026-07-07', 7);
  check('open ON day is pending, not a miss', C.supplementStats(perfect).streak === 3,
        `got ${C.supplementStats(perfect).streak}`);
  // A genuine gap mid-window does break it.
  check('an unmet past ON day breaks the streak', st.streak === 0, `got ${st.streak}`);

  // A dose on an OFF day is extra credit, never adherence.
  const off = C.supplementWindow(alt, {'2026-07-02':true}, '2026-07-07', 7);
  const ost = C.supplementStats(off);
  check('off-schedule dose counts as extra', ost.extra===1 && ost.taken===0, `got extra ${ost.extra}, taken ${ost.taken}`);

  // Rolling: the walk must carry doses forward, so each dose re-phases the next ON day.
  // Jul 2 due (no history) and dosed → Jul 3 off, Jul 4 due again, Jul 5 still due (overdue).
  const rw = C.supplementWindow({every:2, mode:'rolling'}, {'2026-07-02':true}, '2026-07-05', 4);
  check('rolling window re-phases after a dose, and stays ON once overdue',
        rw[0].due && !rw[1].due && rw[2].due && rw[3].due,
        rw.map(c=>(c.due?'O':'.')).join(''));
  // A dose BEFORE the window still sets the phase at the strip's left edge.
  const seeded = C.supplementWindow({every:2, mode:'rolling'}, {'2026-07-04':true}, '2026-07-07', 3);
  check('seeds phase from a dose before the window', !seeded[0].due && seeded[1].due,
        seeded.map(c=>(c.due?'O':'.')).join(''));
})();

// ---- liftWindowOpen: should the app launch on Lift instead of Today? ----
group('liftWindowOpen — the workout window, lead-in, tail and midnight');
(function(){
  const MON=0, TUE=1, FRI=4, SAT=5, SUN=6;
  const at = (h,m)=> h*60 + (m||0);
  // Mon–Fri train, Sat/Sun rest. 18:00–20:00 → open 17:45 (lead) to 20:30 (tail).
  const T = {split:['Pull','Push','Legs','Upper · pull','Upper · push','Rest','Rest'], start:'18:00', end:'20:00'};
  const open = (wd,h,m)=> C.liftWindowOpen(T, wd, at(h,m));

  check('hhmmMinutes parses "18:00"', C.hhmmMinutes('18:00')===1080, `got ${C.hhmmMinutes('18:00')}`);
  check('hhmmMinutes rejects "24:00"', C.hhmmMinutes('24:00')===null, 'expected null');
  check('hhmmMinutes rejects junk', C.hhmmMinutes('soon')===null, 'expected null');
  check('isTrainingSplit: "Rest" is not training', !C.isTrainingSplit('Rest') && !C.isTrainingSplit('  rest  '), 'Rest counted as training');
  check('isTrainingSplit: a named split is', C.isTrainingSplit('Pull'), 'expected true');

  // Mid-session on a training day is the whole point.
  check('Mon 18:30 → open', open(MON,18,30), 'expected open');
  check('Tue 19:59 → open', open(TUE,19,59), 'expected open');
  // Lead-in: turning up early counts, arriving-in-an-hour does not.
  check('Mon 17:45 → open (lead-in edge)', open(MON,17,45), 'expected open');
  check('Mon 17:44 → shut', !open(MON,17,44), 'expected shut');
  check('Mon 17:00 → shut', !open(MON,17,0), 'expected shut');
  // Tail: logging the last set on the way out counts.
  check('Mon 20:30 → open (tail edge)', open(MON,20,30), 'expected open');
  check('Mon 20:31 → shut', !open(MON,20,31), 'expected shut');
  // Rest days never open, whatever the clock says.
  check('Sat 18:30 → shut (rest day)', !open(SAT,18,30), 'expected shut');
  check('Sun 18:30 → shut (rest day)', !open(SUN,18,30), 'expected shut');
  check('Mon 08:00 → shut', !open(MON,8,0), 'expected shut');

  // A late session whose window runs past midnight stays open into the next calendar day,
  // and the NEXT day being a rest day must not close it.
  const LATE = {split:['Pull','Push','Legs','Upper','Upper · push','Rest','Rest'], start:'22:00', end:'00:30'};
  const lateOpen = (wd,h,m)=> C.liftWindowOpen(LATE, wd, at(h,m));
  check('Fri 23:00 → open (end < start)', lateOpen(FRI,23,0), 'expected open');
  check('Sat 00:45 → open (Friday session, past midnight)', lateOpen(SAT,0,45), 'expected open');
  check('Sat 01:05 → shut (tail expired)', !lateOpen(SAT,1,5), 'expected shut');
  check('Sat 23:00 → shut (Saturday is a rest day)', !lateOpen(SAT,23,0), 'expected shut');

  // …and the mirror case: a lead-in that reaches back across midnight.
  const EARLY = {split:['Pull','Push','Legs','Upper','Upper · push','Rest','Rest'], start:'00:05', end:'01:00'};
  check('Sun 23:55 → open (lead-in to Monday session)', C.liftWindowOpen(EARLY, SUN, at(23,55)), 'expected open');
  check('Sun 23:50 → open (lead-in edge, 15 min before 00:05)', C.liftWindowOpen(EARLY, SUN, at(23,50)), 'expected open');
  check('Sun 23:49 → shut', !C.liftWindowOpen(EARLY, SUN, at(23,49)), 'expected shut');

  // Degenerate config must fail closed — never hijack the launch tab on a guess.
  check('no end time → assume an hour', C.liftWindowOpen({split:T.split, start:'18:00'}, MON, at(18,45)), 'expected open');
  check('  …and shut past that hour + tail', !C.liftWindowOpen({split:T.split, start:'18:00'}, MON, at(19,31)), 'expected shut');
  check('unparseable start → shut', !C.liftWindowOpen({split:T.split, start:'evening', end:'20:00'}, MON, at(18,30)), 'expected shut');
  check('missing split → shut', !C.liftWindowOpen({start:'18:00', end:'20:00'}, MON, at(18,30)), 'expected shut');
  check('short split array → shut', !C.liftWindowOpen({split:['Pull'], start:'18:00', end:'20:00'}, MON, at(18,30)), 'expected shut');
  check('all-rest week → shut', !C.liftWindowOpen({split:['Rest','Rest','Rest','Rest','Rest','Rest','Rest'], start:'18:00', end:'20:00'}, MON, at(18,30)), 'expected shut');
  check('no schedule at all → shut', !C.liftWindowOpen(null, MON, at(18,30)), 'expected shut');
})();

group('classifyExercise / sessionMetrics — one session reduced to numbers');
(function(){
  const S = sets => [{date:'2026-06-01', sets}];
  check('low-rep work is judged on strength', C.classifyExercise(S([{kg:100,reps:8},{kg:100,reps:6}])) === 'strength');
  check('high-rep isolation is judged on volume', C.classifyExercise(S([{kg:20,reps:25},{kg:20,reps:22}])) === 'volume');
  check('median exactly at the cap stays strength', C.classifyExercise(S([{kg:40,reps:12},{kg:40,reps:12}])) === 'strength');
  check('one rep over the cap flips it', C.classifyExercise(S([{kg:40,reps:13},{kg:40,reps:13}])) === 'volume');
  check('no data defaults to strength', C.classifyExercise([]) === 'strength');

  // The user's own example: 20x12, 20x8, 15x14.
  const m = C.sessionMetrics([{kg:20,reps:12},{kg:20,reps:8},{kg:15,reps:14}]);
  check('volume is Σ load × reps', approx(m.volume, 610, 0.01), `got ${m.volume}`);
  check('top load is the heaviest set', m.topLoad === 20);
  check('best-set e1RM ignores the over-cap set', approx(m.bestE1RM, 28, 0.01), `got ${m.bestE1RM}`);
  check('best capacity is load × effective reps', approx(m.bestCapacity, 240, 0.01), `got ${m.bestCapacity}`);
  check('all three sets counted', m.sets === 3 && m.skipped === 0 && !m.incomplete);

  // Junk sets must not be able to inflate the strength signal.
  const junk = C.sessionMetrics([{kg:20,reps:12},{kg:20,reps:8},{kg:15,reps:14},{kg:5,reps:12},{kg:5,reps:12}]);
  check('extra light sets raise volume but not best-set e1RM',
        junk.volume > m.volume && approx(junk.bestE1RM, m.bestE1RM, 0.01), `got ${junk.bestE1RM}`);

  // Exercise-level RIR applies to every set — biased, but biased identically each session.
  const r = C.sessionMetrics([{kg:20,reps:12},{kg:20,reps:8},{kg:15,reps:14}], {rir:2});
  check('RIR pushes the 12-rep set over the cap, so the 8 wins', approx(r.bestE1RM, 26.667, 0.01), `got ${r.bestE1RM}`);
  check('RIR raises capacity', approx(r.bestCapacity, 280, 0.01), `got ${r.bestCapacity}`);
  check('median RIR is recorded', r.medianRir === 2 && r.hasRir);
  const perSet = C.sessionMetrics([{kg:20,reps:8,rir:0},{kg:20,reps:8,rir:4}], {rir:2});
  check('a per-set RIR overrides the exercise-level one', perSet.medianRir === 2 && approx(perSet.bestE1RM, 20*(1+12/30), 0.01),
        `got rir ${perSet.medianRir}, e1RM ${perSet.bestE1RM}`);

  const bw = C.sessionMetrics([{kg:10,reps:6,bw:true}], {bodyweightKg:80});
  check('bodyweight movement carries the body into the load', approx(bw.volume, 540, 0.01) && approx(bw.bestE1RM, 108, 0.01),
        `got vol ${bw.volume}, e1RM ${bw.bestE1RM}`);
  const bwNone = C.sessionMetrics([{kg:10,reps:6,bw:true}], {});
  check('without a weigh-in the set is skipped, not counted as zero',
        bwNone.sets === 0 && bwNone.skipped === 1 && bwNone.incomplete && bwNone.volume === 0 && bwNone.bestE1RM === null);
})();

// ---- exerciseTrend: the stall verdict ----
group('exerciseTrend — progressing, stalled, grinding, drifting');
(function(){
  const D = ['2026-06-01','2026-06-08','2026-06-15','2026-06-22','2026-06-29','2026-07-06'];
  // One top set per session, so the metric moves only when real output moves.
  const series = (loads, reps, rirs) => D.map((d,i)=>({
    date:d, sets:[{kg:loads[i], reps:reps||5}], rir: rirs ? rirs[i] : undefined }));

  const up = C.exerciseTrend(series([100,102,104,106,108,110]), {name:'Bench press'});
  check('rising loads read as progressing', up.verdict === 'progressing', `got ${up.verdict}`);
  check('trend is +8.16 %/month', approx(up.pctPerMonth, 8.163, 0.01), `got ${up.pctPerMonth}`);
  check('judged on e1RM with 6 usable sessions', up.cls === 'strength' && up.metric === 'e1RM' && up.n === 6);
  // A dead-straight six-session climb has a near-zero margin of error → top tier.
  check('a clean six-session climb earns high confidence', up.confidence === 'high', `got ${up.confidence}`);
  check('and reports a tiny margin of error', up.pctSE != null && up.pctSE < 0.5, `got ±${up.pctSE}`);

  const down = C.exerciseTrend(series([110,108,106,104,102,100]), {});
  check('falling loads read as regressing', down.verdict === 'regressing', `got ${down.verdict}`);
  check('trend is −8.16 %/month', approx(down.pctPerMonth, -8.163, 0.01), `got ${down.pctPerMonth}`);

  const flat = C.exerciseTrend(series([100,100,100,100,100,100], 5, [2,2,2,2,2,2]), {});
  check('flat output with steady effort is a real stall', flat.verdict === 'stalled', `got ${flat.verdict}`);
  check('a stall reports a zero trend, not a small one', approx(flat.pctPerMonth, 0, 0.001), `got ${flat.pctPerMonth}`);

  // Same top set every week, but the set COUNT climbs: more work, same output.
  const grind = C.exerciseTrend(D.map((d,i)=>{
    const n = [3,3,4,4,5,5][i], sets = [];
    for (let k=0;k<n;k++) sets.push({kg:100, reps:5});
    return {date:d, sets};
  }), {});
  check('flat strength with climbing volume is grinding', grind.verdict === 'grinding', `got ${grind.verdict}`);
  check('grinding still shows a flat strength trend', approx(grind.pctPerMonth, 0, 0.001), `got ${grind.pctPerMonth}`);
  check('and a rising volume trend', approx(grind.volPctPerMonth, 48.98, 0.05), `got ${grind.volPctPerMonth}`);

  // Loads fall while reported RIR climbs — capacity nets out flat, but the flatness now
  // rests on a self-reported number that is drifting, so it must not be called a stall.
  const drift = C.exerciseTrend(series([100,97.5,95,92.5,90,87.5], 5, [0,1,2,3,4,5]), {});
  check('flat metric under drifting effort is not called a stall', drift.verdict === 'effort-drift', `got ${drift.verdict}`);
  check('the RIR drift itself is measured', approx(drift.rirPerMonth, 4.286, 0.01), `got ${drift.rirPerMonth}`);
  check('and the metric really is flat', approx(drift.pctPerMonth, 0, 0.001), `got ${drift.pctPerMonth}`);

  // Only the CHANGE in RIR is ever read, so a constant personal bias cannot move a verdict.
  const honest = C.exerciseTrend(series([100,102,104,106,108,110], 5, [1,1,1,1,1,1]), {});
  const modest = C.exerciseTrend(series([100,102,104,106,108,110], 5, [4,4,4,4,4,4]), {});
  check('a constant RIR bias leaves the trend identical',
        approx(honest.pctPerMonth, modest.pctPerMonth, 0.001) && honest.verdict === modest.verdict,
        `got ${honest.pctPerMonth} vs ${modest.pctPerMonth}`);

  // Two sessions is a line through two dots (df=0) — no margin can be measured, so it stays
  // "building data"; three is the first read.
  const thin = C.exerciseTrend(series([100,102]).slice(0,2), {});
  check('two sessions is too thin to call', thin.verdict === 'thin', `got ${thin.verdict}`);
  check('and it says one more is needed', thin.sessionsNeeded === 1, `got ${thin.sessionsNeeded}`);
  check('a two-session read has no margin of error', thin.pctSE == null, `got ${thin.pctSE}`);
  check('no history at all is thin, not an error', C.exerciseTrend([], {}).verdict === 'thin');
  // Three sessions now DOES produce a read — provisional, low confidence, with its margin.
  const three = C.exerciseTrend(series([100,103,106]).slice(0,3), {});
  check('three sessions produces a verdict now', three.verdict !== 'thin', `got ${three.verdict}`);
  check('rising three-session read is progressing', three.verdict === 'progressing', `got ${three.verdict}`);
  check('but only at low confidence', three.confidence === 'low', `got ${three.confidence}`);
  check('and it carries an explicit margin of error', three.pctSE != null, `got ${three.pctSE}`);
  check('nothing more is demanded at three sessions', three.sessionsNeeded === 0, `got ${three.sessionsNeeded}`);

  // High-rep isolation: e1RM is never computed, capacity is.
  const fp = C.exerciseTrend(D.map((d,i)=>({date:d, sets:[{kg:20, reps:25+i}], rir:3})), {name:'Face pull'});
  check('high-rep work is tracked on capacity, not e1RM', fp.cls === 'volume' && fp.metric === 'capacity', `got ${fp.cls}`);
  check('added reps at the same load is progress', fp.verdict === 'progressing', `got ${fp.verdict}`);
  check('capacity trend is +14.05 %/month', approx(fp.pctPerMonth, 14.05, 0.05), `got ${fp.pctPerMonth}`);
  // Strength-endurance work now earns confidence from its own data like anything else — a
  // clean six-session capacity climb is high confidence. It is still kept out of the recomp
  // verdict (liftVsWeight filters to strength), so this can't distort the muscle estimate.
  check('a clean high-rep capacity climb can earn high confidence', fp.confidence === 'high', `got ${fp.confidence}`);
  check('and it carries a margin of error too', fp.pctSE != null, `got ${fp.pctSE}`);

  // Median reps sits at the cap, but every session's RIR pushes it past — no e1RM is
  // available, so the exercise is judged on capacity rather than reported as thin.
  const rescue = C.exerciseTrend(D.map(d=>({date:d, sets:[{kg:20,reps:12}], rir:3})), {});
  check('an exercise that yields no e1RM falls back to capacity', rescue.cls === 'volume', `got ${rescue.cls}`);
  check('and still returns a verdict', rescue.verdict !== 'thin', `got ${rescue.verdict}`);

  // Bodyweight movements resolve their load from the weight log.
  const pu = C.exerciseTrend(D.map((d,i)=>({date:d, sets:[{kg:i, reps:6, bw:true}]})),
                             {weights:[{date:'2026-05-01',kg:80}]});
  check('bodyweight lifts use the logged bodyweight', pu.verdict === 'progressing' && pu.n === 6, `got ${pu.verdict}, n ${pu.n}`);
  const puNone = C.exerciseTrend(D.map((d,i)=>({date:d, sets:[{kg:i, reps:6, bw:true}]})), {weights:[]});
  check('with no weigh-ins a bodyweight lift is thin, not wrong', puNone.verdict === 'thin', `got ${puNone.verdict}`);

  // Sessions older than the window must not drag the current trend.
  const stale = [{date:'2026-01-05', sets:[{kg:200,reps:5}]}].concat(series([100,102,104,106,108,110]));
  check('sessions outside the 8-week window are dropped',
        C.exerciseTrend(stale, {}).n === 6 && C.exerciseTrend(stale, {}).verdict === 'progressing',
        `got n ${C.exerciseTrend(stale, {}).n}`);
  check('sessions in any order still fit', approx(C.exerciseTrend(series([100,102,104,106,108,110]).reverse(), {}).pctPerMonth, 8.163, 0.01));
})();

// ---- margin of error + graduated confidence ----
group('exerciseTrend — margin of error and confidence that sharpens with data');
(function(){
  const mk = (dates, loads, reps) => dates.map((d,i)=>({date:d, sets:[{kg:loads[i], reps:reps||5}]}));
  // linearTrend exposes the slope's standard error: zero for a perfect line, positive for
  // scatter, null with only two points (no residual to measure).
  const clean = C.linearTrend([{x:0,y:100},{x:1,y:102},{x:2,y:104},{x:3,y:106}]);
  check('a perfect line has zero slope error', clean.se != null && approx(clean.se, 0, 1e-9), `got ${clean.se}`);
  const noisy = C.linearTrend([{x:0,y:100},{x:1,y:90},{x:2,y:115},{x:3,y:95}]);
  check('scatter off the line gives a positive slope error', noisy.se > 0, `got ${noisy.se}`);
  check('two points give no error estimate (df=0)', C.linearTrend([{x:0,y:100},{x:1,y:110}]).se == null, 'expected null');

  const D6 = ['2026-06-01','2026-06-08','2026-06-15','2026-06-22','2026-06-29','2026-07-06'];
  const D4 = D6.slice(0,4);
  // Same clean upward signal, more sessions → the margin shrinks and confidence climbs.
  const se3 = C.exerciseTrend(mk(D6.slice(0,3), [100,102,104]), {}).pctSE;
  const se6 = C.exerciseTrend(mk(D6, [100,102,104,106,108,110]), {}).pctSE;
  check('a clean read has a defined margin at three sessions', se3 != null, `got ${se3}`);
  check('three and six sessions of a clean line both fit tightly', se6 != null && se6 <= 0.5 && se3 <= 0.5, `3:${se3} 6:${se6}`);

  // Confidence is earned from the margin, not just the count: a noisy six-session lift can
  // read below a clean four-session one.
  const clean4 = C.exerciseTrend(mk(D4, [100,102,104,106]), {});
  check('a clean four-session lift reaches at least medium', clean4.confidence === 'medium' || clean4.confidence === 'high', `got ${clean4.confidence}`);
  const noisy6 = C.exerciseTrend(mk(D6, [100,120,95,130,90,125]), {});
  check('a wildly noisy six-session lift stays low', noisy6.confidence === 'low', `got ${noisy6.confidence}`);

// ---- liftVsWeight: the reason this lives in a food tracker ----
group('liftVsWeight — is the surplus buying muscle or fat?');
(function(){
  const t = (pct, verdict) => ({cls:'strength', verdict: verdict||'progressing', pctPerMonth: pct});
  const gaining = {ratePerWeek: 0.4}, losing = {ratePerWeek: -0.4}, steady = {ratePerWeek: 0.05};

  const build = C.liftVsWeight([t(5),t(6),t(7)], gaining);
  check('weight up + strength up = building', build.status === 'building', `got ${build.status}`);
  check('the median lift trend is reported', build.strengthPctPerMonth === 6, `got ${build.strengthPctPerMonth}`);
  check('and the bodyweight rate rides along', build.kgPerWeek === 0.4);

  const spin = C.liftVsWeight([t(0.5,'stalled'),t(0,'stalled'),t(1,'stalled')], gaining);
  check('weight up + strength flat = spinning', spin.status === 'spinning', `got ${spin.status}`);
  check('stalled lifts are counted', spin.stalled === 3, `got ${spin.stalled}`);

  check('weight down + strength held = retaining',
        C.liftVsWeight([t(0,'stalled')], losing).status === 'retaining');
  check('weight down + strength down = shedding',
        C.liftVsWeight([t(-5,'regressing')], losing).status === 'shedding');
  check('weight steady + strength up = recomping',
        C.liftVsWeight([t(5)], steady).status === 'recomping');
  check('weight steady + strength steady = holding',
        C.liftVsWeight([t(0,'stalled')], steady).status === 'holding');

  // One wild lift must not swing the headline — hence the median.
  check('an outlier lift cannot flip the verdict',
        C.liftVsWeight([t(0,'stalled'),t(0,'stalled'),t(90)], gaining).status === 'spinning');
  // Rear-delt and cuff work is health maintenance; its noise must not vote.
  check('volume-class lifts do not vote',
        C.liftVsWeight([{cls:'volume',verdict:'progressing',pctPerMonth:50}, t(0,'stalled')], gaining).status === 'spinning');
  check('thin lifts do not vote',
        C.liftVsWeight([{cls:'strength',verdict:'thin',pctPerMonth:null}], gaining).status === 'thin');
  check('no weight trend, no verdict', C.liftVsWeight([t(5)], null).status === 'thin');

  // The waist as a third axis: it refines the verdict into a lean-mass reading without
  // touching the weight×strength status any existing caller relies on.
  const noWaist = C.liftVsWeight([t(5),t(6),t(7)], gaining);
  check('no waist trend leaves leanVerdict null', noWaist.leanVerdict === null, `got ${noWaist.leanVerdict}`);
  const wide = {perWeek: 0.4}, tight = {perWeek: 0.0}, shrinking = {perWeek: -0.4};
  check('gain + waist widening = fat-gain',
        C.liftVsWeight([t(5),t(6),t(7)], gaining, wide).leanVerdict === 'fat-gain');
  check('gain + strength up + waist steady = lean-gain',
        C.liftVsWeight([t(5),t(6),t(7)], gaining, tight).leanVerdict === 'lean-gain');
  check('gain + strength flat + waist steady = lean-hold',
        C.liftVsWeight([t(0,'stalled'),t(0,'stalled')], gaining, tight).leanVerdict === 'lean-hold');
  check('loss + waist shrinking = fat-loss',
        C.liftVsWeight([t(0,'stalled')], losing, shrinking).leanVerdict === 'fat-loss');
  check('loss + waist not moving = muscle-risk',
        C.liftVsWeight([t(0,'stalled')], losing, tight).leanVerdict === 'muscle-risk');
  check('steady weight + waist shrinking = recomp',
        C.liftVsWeight([t(5)], steady, shrinking).leanVerdict === 'recomp');
  check('steady weight + waist widening = skinny-fat',
        C.liftVsWeight([t(0,'stalled')], steady, wide).leanVerdict === 'skinny-fat');
  check('the waist rate is carried through', C.liftVsWeight([t(5)], steady, shrinking).waistCmPerWeek === -0.4);
  check('the weight×strength status is unchanged by the waist axis',
        C.liftVsWeight([t(5),t(6),t(7)], gaining, wide).status === 'building');
})();

// ---- name canonicalisation: what the whole feature stands on ----
group('normalizeName / matchExercise — one lift, one trend line');
(function(){
  const K = C.SEED_EXERCISES;
  check('plurals collapse', C.normalizeName('bicep curls') === 'bicep curl', `got "${C.normalizeName('bicep curls')}"`);
  check('abbreviations expand', C.normalizeName('DB Curls') === 'dumbbell curl', `got "${C.normalizeName('DB Curls')}"`);
  check('punctuation is not identity', C.normalizeName('Pull-ups') === C.normalizeName('pull ups'), `got "${C.normalizeName('Pull-ups')}"`);
  check('double-s words survive singularisation', C.normalizeName('bench press') === 'bench press');
  // The bug this replaces: a lone trailing "s" turned "crunches" into "crunche", a token
  // no singular spelling can match, so "Cable Crunch" started a SECOND exercise beside
  // "Cable Crunches" and split the history in half.
  check('-es after ch drops both', C.normalizeName('cable crunches') === 'cable crunch', `got "${C.normalizeName('cable crunches')}"`);
  check('-es after ss drops both', C.singularise('presses') === 'press', `got ${C.singularise('presses')}`);
  check('-es after x drops both', C.singularise('boxes') === 'box', `got ${C.singularise('boxes')}`);
  check('-ies becomes -y', C.singularise('flies') === 'fly', `got ${C.singularise('flies')}`);
  check('a stem already ending in e keeps it', C.singularise('raises') === 'raise', `got ${C.singularise('raises')}`);
  check('lunges keeps its e too', C.singularise('lunges') === 'lunge', `got ${C.singularise('lunges')}`);
  check('a plain plural still drops one s', C.singularise('curls') === 'curl');
  check('a singular is left alone', C.singularise('crunch') === 'crunch' && C.singularise('press') === 'press');
  check('singular and plural now reach the same exercise',
        C.normalizeName('Cable Crunch') === C.normalizeName('Cable Crunches'));
  check('an existing crunche-id entry still matches by name',
        (C.matchExercise('cable crunch', [{id:'cable-crunche', name:'Cable Crunches', aliases:[]}])||{}).exercise
          ? true : false);
  check('id is the normalised slug', C.exerciseId('DB Curls') === 'dumbbell-curl', `got ${C.exerciseId('DB Curls')}`);

  const same = ['bicep curls','bicep curl','db curls','dumbbell curl','curls'].map(n => {
    const m = C.matchExercise(n, K); return m && m.exercise.id;
  });
  check('five ways of writing a curl land on one exercise',
        same.every(id => id === 'bicep-curl'), same.join(' / '));
  check('shorthand resolves', (C.matchExercise('bench', K)||{}).exercise.id === 'bench-press');
  check('pullups resolves to pull-up', (C.matchExercise('pullups', K)||{}).exercise.id === 'pull-up');
  check('facepulls resolves to face pull', (C.matchExercise('facepulls', K)||{}).exercise.id === 'face-pull');

  // The failure that would quietly destroy the data: merging two different movements.
  check('a qualifier makes it a different lift',
        C.matchExercise('incline bench press', [{id:'bench-press',name:'Bench press',aliases:['bench']}]) === null);
  check('hammer curl is not a bicep curl',
        (C.matchExercise('hammer curl', K)||{}).exercise.id === 'hammer-curl');
  check('an unknown lift stays unknown rather than snapping to a cousin',
        C.matchExercise('zercher squat', K) === null);
  check('the seeded incline press is still found',
        (C.matchExercise('incline db press', K)||{}).exercise.id === 'incline-dumbbell-press');
})();

// ---- corridorDrift: has the corridor stopped describing what you eat? ----
group('corridorDrift — a ceiling passed most days is not a warning');
(function(){
  const band = (kcals, floor, ceil) => kcals.map(kcal => ({kcal, floor, ceil}));
  const over = band(Array.from({length:22}, (_,i) => i < 16 ? 2841 : 2400), 2325, 2525);
  const d = C.corridorDrift(over);
  check('a sustained breach is called', d.verdict === 'over', `got ${d.verdict}`);
  check('it counts the breached days', d.over === 16, `got ${d.over}`);
  check('the gap is the median overshoot past the ceiling',
        d.gap === 2841 - 2525, `got ${d.gap}`);
  check('the median intake is reported', d.median === 2841, `got ${d.median}`);

  const under = band(Array.from({length:14}, () => 1200), 1650, 1900);
  check('a sustained shortfall is called too', C.corridorDrift(under).verdict === 'under');
  check('the shortfall gap is negative', C.corridorDrift(under).gap === -450);

  // Being inside is the expected case and must stay silent.
  check('a corridor that fits says nothing',
        C.corridorDrift(band(Array.from({length:20}, (_,i) => 2400 + (i%3)*30), 2325, 2525)).verdict === 'aligned');
  // A handful of days is a bad week, not a mis-set corridor.
  check('too few days stays thin', C.corridorDrift(band([3000,3000,3000,3000], 2325, 2525)).verdict === 'thin');
  check('an even split is not drift',
        C.corridorDrift(band(Array.from({length:20}, (_,i)=> i%2 ? 2800 : 2400), 2325, 2525)).verdict === 'aligned');
  check('a nonsense corridor is refused', C.corridorDrift(band(over.map(d=>d.kcal), 2500, 2500)).verdict === 'thin');

  // The failure this shape exists to prevent: a training/rest cycle swings the corridor
  // by 400 kcal a day, so eating to each day's OWN target must not read as drift.
  // A real week is 2 training days and 5 rest days, so most days sit on the low corridor.
  const cycled = Array.from({length:21}, (_,i) => i % 7 < 2
    ? {kcal: 2900, floor: 2800, ceil: 3000}      // training day, eaten to plan
    : {kcal: 2400, floor: 2300, ceil: 2500});    // rest day, eaten to plan
  check('cycling to plan is not drift', C.corridorDrift(cycled).verdict === 'aligned',
        `got ${C.corridorDrift(cycled).verdict}`);
  check('the same days judged by one corridor WOULD have been called drift',
        C.corridorDrift(cycled.map(d => ({kcal:d.kcal, floor:2800, ceil:3000}))).verdict === 'under',
        'this is the false alarm the per-day bounds exist to prevent');
  // Overshooting a moving corridor is still drift.
  check('cycling and overeating both is still called',
        C.corridorDrift(cycled.map(d => ({kcal:d.kcal+500, floor:d.floor, ceil:d.ceil}))).verdict === 'over');
})();

group('muscleProgress — roll exercise trends up onto the muscle behind them');
(function(){
  const T = (id, name, pct, se, verdict, confidence, sets) =>
    ({ id, t:{ name, pctPerMonth:pct, pctSE:se, verdict, confidence, setsTotal:sets, n:5, cls:'strength' } });
  // Two chest presses climbing, a triceps isolation falling, a lone side-delt lift.
  const trends = [
    T('bench-press',            'Bench',      5,   1.5, 'progressing', 'high',   12),
    T('incline-dumbbell-press', 'Incline DB', 3,   2.0, 'progressing', 'medium',  8),
    T('tricep-pushdown',        'Pushdown',  -4,   2.5, 'regressing',  'medium',  9),
    T('lateral-raise',          'Lateral',    0.5, 1.0, 'stalled',     'medium', 10),
    T('leg-curl',               'Leg curl',   null,null,'thin',        'none',    2)   // ignored
  ];
  const p = C.muscleProgress(trends, []);   // empty catalogue → seed muscles resolve by id
  check('chest rolls up from two climbing presses', p.chest && p.chest.verdict==='progressing', JSON.stringify(p.chest));

  // The nuance the whole feature is for: the isolation reads regression, but the presses that

  check('triceps nets to holding despite the pushdown falling',

  check('triceps pulls from all three lifts that touch it', p.triceps.nExercises===3, `n=${p.triceps && p.triceps.nExercises}`);

group('energyBalance — per-day surplus/deficit and the running total');
(function(){
  const days = [
    {date:'2026-08-01', kcal:3000, tdee:2700, floor:2900, ceil:3100},
    {date:'2026-08-02', kcal:2500, tdee:2700, floor:2600, ceil:2800},
    {date:'2026-08-03', kcal:3400, tdee:2700, floor:2900, ceil:3100}];
  const r = C.energyBalance(days);
  check('signed balance per day', r.points.map(p=>p.balance).join(',')==='300,-200,700', r.points.map(p=>p.balance).join(','));
  check('cum is the running sum', r.points.map(p=>p.cum).join(',')==='300,100,800');
  check('sum and average', r.sum===800 && r.avg===267, `${r.sum} / ${r.avg}`);
  check('predicted kg uses 7700', approx(r.predictedKg, 0.10, 0.005), `${r.predictedKg}`);
  // Each day is judged against ITS OWN corridor, which is the whole point of the shape.
  check('state uses that day’s bounds', r.points.map(p=>p.state).join(',')==='in,under,over', r.points.map(p=>p.state).join(','));
  check('inside/over/under tallies', r.inside===1 && r.over===1 && r.under===1);
  check('surplus vs deficit day counts', r.surplusDays===2 && r.deficitDays===1);
  // The regression guard: same intake, different day-bounds, different verdict. Judging a
  // rest day by a training day's ceiling is exactly the error this shape prevents.
  const byFlat = C.energyBalance([{date:'2026-08-02', kcal:2700, tdee:2700, floor:2900, ceil:3100}]);
  const byOwn  = C.energyBalance([{date:'2026-08-02', kcal:2700, tdee:2700, floor:2600, ceil:2800}]);
  check('one corridor for all days would mislabel a rest day',
        byFlat.points[0].state==='under' && byOwn.points[0].state==='in');
  check('balance is unaffected by the corridor', byFlat.points[0].balance===0 && byOwn.points[0].balance===0);
  check('unordered input is sorted', C.energyBalance([days[2],days[0],days[1]]).points[0].date==='2026-08-01');
  check('days without intake or TDEE are dropped', C.energyBalance([{date:'x',kcal:0,tdee:2700},{date:'y',kcal:2000,tdee:0}]).n===0);
  check('empty input is safe', C.energyBalance([]).n===0 && C.energyBalance(null).sum===0);
  check('missing bounds report unknown, not a false pass',
        C.energyBalance([{date:'2026-08-01',kcal:3000,tdee:2700}]).points[0].state==='unknown');

  const cut = C.energyBalance([{date:'2026-08-01',kcal:1800,tdee:2400,floor:1900,ceil:2100}]);
  check('a deficit reads negative', cut.points[0].balance===-600 && cut.predictedKg < 0);

        C.projectionConfidence('high','none',{ignoreTDEE:true})==='high');
  check('but never invents confidence the trend lacks',
        C.projectionConfidence('low','high',{ignoreTDEE:true})==='low');
  check('unknown tiers degrade to none', C.projectionConfidence('bogus','high')==='none');
})();


// ---- measureTrend: a slope needs a baseline long enough to carry it ----
group('measureTrend — span guard against extrapolated tape noise');
(function(){
  // The real failing case: six readings across five days produced "+30 cm/month".
  const short = [{date:'2026-08-21',v:56},{date:'2026-08-23',v:58}];
  const t = C.measureTrend(short);
  check('the fit is still returned', t && approx(t.perMonth, 30, 0.01), `${t && t.perMonth}`);
  check('but the span is reported', t.spanDays===2, `${t.spanDays}`);
  check('and it is marked unreliable', t.reliable===false);
  // Long enough baseline, enough readings.
  const good = [{date:'2026-06-01',v:56},{date:'2026-07-01',v:56.3},{date:'2026-08-01',v:56.6}];
  const g = C.measureTrend(good);
  check('a proper baseline is reliable', g.reliable===true, `span ${g.spanDays} n ${g.n}`);
  check('and reports a sane monthly rate', approx(g.perMonth, 0.3, 0.02), `${g.perMonth}`);
  // Both conditions are required, not either.
  const twoFar = [{date:'2026-06-01',v:56},{date:'2026-08-01',v:57}];
  check('a long span with only two readings is not reliable', C.measureTrend(twoFar).reliable===false);
  const manyClose = [{date:'2026-08-20',v:56},{date:'2026-08-21',v:56.5},{date:'2026-08-22',v:57},{date:'2026-08-23',v:57.5}];
  check('many readings over a few days is not reliable either', C.measureTrend(manyClose).reliable===false);
  check('fewer than two readings is still null', C.measureTrend([{date:'2026-08-01',v:56}])===null);
})();

// ---- siteProgress: refuses to quote a rate it cannot support ----
group('siteProgress — no rate without a baseline');
(function(){
  const short = {
    waist: [{date:'2026-08-18',v:76.5},{date:'2026-08-21',v:77},{date:'2026-08-23',v:76}],
    thigh: [{date:'2026-08-21',v:56},{date:'2026-08-23',v:58}]
  };
  const r = C.siteProgress(short, {quads:20}, {})[0];
  check('an unusable baseline yields no cm/month', r.cmPerMonth===null, `${r.cmPerMonth}`);
  check('and no ratio', r.ratioPctPerMonth===null);
  check('the verdict stays thin', r.verdict==='thin', r.verdict);
  check('and no signal is claimed', r.signal==='none', r.signal);
  check('but the span and a reason are reported', r.spanDays===2 && r.reliable===false && !!r.reason, r.reason);
  check('the latest reading still shows', r.latest===58);
  // The same site with a real baseline recovers everything.
  const long = {
    waist: [{date:'2026-06-01',v:84},{date:'2026-07-01',v:84.5},{date:'2026-08-01',v:85}],
    thigh: [{date:'2026-06-01',v:56},{date:'2026-07-01',v:56.5},{date:'2026-08-01',v:57}]
  };
  const L = C.siteProgress(long, {quads:20}, {})[0];
  check('a real baseline produces a rate again', L.reliable===true && L.cmPerMonth!=null && L.ratioPctPerMonth!=null);
  check('and a directional verdict', L.verdict!=='thin', L.verdict);
})();

// ---- siteProgress: confidence is set by the WEAKEST contributor ----
group('siteProgress — pooled confidence cannot exceed its parts');
(function(){
  const S = { waist:[{date:'2026-06-01',v:84},{date:'2026-07-01',v:84.5},{date:'2026-08-01',v:85}],
              arm:  [{date:'2026-06-01',v:35},{date:'2026-07-01',v:35.8},{date:'2026-08-01',v:36.6}] };
  const vol = {biceps:18, triceps:17};
  // The real case: biceps regressing at low confidence, triceps climbing at high.
  const split = {biceps:{pctPerMonth:-15.0,confidence:'low'}, triceps:{pctPerMonth:89.1,confidence:'high'}};
  const r = C.siteProgress(S, vol, split)[0];
  check('the average is still the weighted mean', approx(r.strengthPct, (18*-15+17*89.1)/35, 0.2), `${r.strengthPct}`);
  check('but confidence is not "high"', r.strengthConfidence!=='high', r.strengthConfidence);
  check('it is the weakest contributor', r.strengthConfidence==='low', r.strengthConfidence);
  // Agreeing muscles keep the weakest tier, but are not punished further.
  const agree = {biceps:{pctPerMonth:12,confidence:'medium'}, triceps:{pctPerMonth:9,confidence:'high'}};
  check('agreeing muscles keep the weakest tier', C.siteProgress(S, vol, agree)[0].strengthConfidence==='medium');
  const bothHigh = {biceps:{pctPerMonth:12,confidence:'high'}, triceps:{pctPerMonth:9,confidence:'high'}};
  check('two agreeing high muscles stay high', C.siteProgress(S, vol, bothHigh)[0].strengthConfidence==='high');
  // Opposite signs cap the tier even when both contributors are individually high.
  const bothHighSplit = {biceps:{pctPerMonth:-12,confidence:'high'}, triceps:{pctPerMonth:9,confidence:'high'}};
  check('disagreement caps two high muscles at low',
        C.siteProgress(S, vol, bothHighSplit)[0].strengthConfidence==='low');
  // A single contributor cannot "disagree" with itself.
  const one = C.siteProgress(S, {biceps:18}, {biceps:{pctPerMonth:12,confidence:'high'}})[0];
  check('one muscle keeps its own tier', one.strengthConfidence==='high', one.strengthConfidence);
})();


// ---- swUpdateAction: when is it safe to take a new build? ----
group('swUpdateAction — service-worker update policy');
(function(){
  const A = (o) => C.swUpdateAction(Object.assign({hadController:true}, o));
  // The first-ever install controls nothing, so there is no old page to replace.
  check('first install does nothing', C.swUpdateAction({hadController:false, trigger:'activated', visible:true})==='none');
  check('and does nothing on reopen either', C.swUpdateAction({hadController:false, trigger:'reopened', visible:true, pending:true})==='none');

  // A worker activating while you are looking at the app must never yank the page away.
  check('activated while visible only offers', A({trigger:'activated', visible:true})==='offer');
  check('offering twice is suppressed', A({trigger:'activated', visible:true, offered:true})==='none');
  // Activating while backgrounded is the case the whole change exists for.
  check('activated while hidden waits', A({trigger:'activated', visible:false})==='wait');
  check('a hidden activation never reloads behind your back', A({trigger:'activated', visible:false})!=='reload');

  // Reopening an idle app is the one moment a swap costs nothing.
  check('reopening with an update pending reloads', A({trigger:'reopened', visible:true, pending:true})==='reload');
  check('reopening with nothing pending just polls', A({trigger:'reopened', visible:true})==='check');
  // A reload discards whatever is only in the DOM, so work in progress blocks it outright.
  check('work in progress downgrades to an offer',
        A({trigger:'reopened', visible:true, pending:true, busy:true})==='offer');
  check('and never reloads', A({trigger:'reopened', visible:true, pending:true, busy:true})!=='reload');
  check('busy plus already-offered stays quiet',
        A({trigger:'reopened', visible:true, pending:true, busy:true, offered:true})==='none');
  // A previously-ignored toast still gets applied on the next clean reopen.
  check('an ignored toast is applied on the next idle reopen',
        A({trigger:'reopened', visible:true, pending:true, offered:true})==='reload');

  // Guards that prevent a reload loop or a reload nobody can see.
  check('once reloading, everything is inert',
        A({trigger:'reopened', visible:true, pending:true, reloading:true})==='none'
        && A({trigger:'activated', visible:true, reloading:true})==='none');
  check('a reopen event while still hidden does nothing',
        A({trigger:'reopened', visible:false, pending:true})==='none');
  check('missing options never throw', C.swUpdateAction()==='none' && C.swUpdateAction({})==='none');
  // Only these five verbs are ever returned — the caller switches on them exhaustively.
  const verbs = ['none','offer','wait','reload','check'];
  let ok = true;
  [true,false].forEach(v => [true,false].forEach(p => [true,false].forEach(b => [true,false].forEach(o => {
    ['activated','reopened'].forEach(tr => {
      if (verbs.indexOf(A({trigger:tr, visible:v, pending:p, busy:b, offered:o})) < 0) ok = false;
    });
  }))));
  check('every input combination returns a known verb', ok);
})();
