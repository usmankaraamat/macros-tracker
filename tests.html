<div id="summary">running…</div>
<div id="out"></div>

<script src="core.js"></script>
<script>
const out = document.getElementById('out');
let passed = 0, failed = 0;
const approx = (a,b,eps=0.5) => Math.abs(a-b) <= eps;
function group(name){ const d=document.createElement('div'); d.className='grp'; d.textContent=name; out.appendChild(d); }
function check(name, cond, detail){
  const d = document.createElement('div');
  d.className = 'case ' + (cond ? 'pass' : 'fail');
  d.innerHTML = name + (detail ? ` <span class="detail">— ${detail}</span>` : '');
  out.appendChild(d);
  cond ? passed++ : failed++;
}

const C = LedgerCore, T = LedgerCore.ternary;

// ---- nutrientsFrom: USDA energy pick ----
group('nutrientsFrom — energy field selection');
(function(){
  const food = { foodNutrients:[
    {nutrientNumber:'208', value:5}, {nutrientNumber:'957', value:73.5},
    {nutrientNumber:'203', value:1.9}, {nutrientNumber:'204', value:0.1}, {nutrientNumber:'205', value:17}
  ]};
  const n = C.nutrientsFrom(food);
  check('prefers Atwater #957 over bogus #208', approx(n.kcal, 73.5), `got ${n.kcal}`);

  const food2 = { foodNutrients:[
    {nutrientNumber:'208', value:5},
    {nutrientNumber:'203', value:1.9}, {nutrientNumber:'204', value:0.1}, {nutrientNumber:'205', value:17}
  ]};
  const n2 = C.nutrientsFrom(food2);         // no Atwater, #208=5 is < half of macro est (76.5) → trust macros
  check('macro safety net overrides implausible #208', approx(n2.kcal, 76.5), `got ${n2.kcal}`);

  const food3 = { foodNutrients:[
    {nutrientNumber:'208', value:165},
    {nutrientNumber:'203', value:31}, {nutrientNumber:'204', value:3.6}, {nutrientNumber:'205', value:0}
  ]};
  const n3 = C.nutrientsFrom(food3);
  check('uses plausible #208 when no Atwater present', approx(n3.kcal, 165), `got ${n3.kcal}`);

  // Micronutrients: 291 fiber(g), 269 sugars(g), 307 sodium(mg).
  const food4 = { foodNutrients:[
    {nutrientNumber:'208', value:165}, {nutrientNumber:'203', value:31},
    {nutrientNumber:'291', value:2.5}, {nutrientNumber:'269', value:1.2}, {nutrientNumber:'307', value:400}
  ]};
  const n4 = C.nutrientsFrom(food4);
  check('extracts fiber/sugar/sodium', n4.fib===2.5 && n4.sug===1.2 && n4.na===400, `got fib${n4.fib} sug${n4.sug} na${n4.na}`);
  check('missing micros default to 0', C.nutrientsFrom({foodNutrients:[{nutrientNumber:'208',value:100}]}).fib===0, '');
})();

// ---- target resolution ----
group('resolvePTarget / capGrams');
check('protein 30% of 1700 kcal floor = 127.5g', approx(C.resolvePTarget({mode:'pct',val:30}, 1700), 127.5), '');
check('protein grams mode passes through', C.resolvePTarget({mode:'g',val:120}, 1700) === 120, '');
check('carb cap 40% of 1700 @4kcal/g = 170g', approx(C.capGrams({mode:'pct',val:40}, 4, 1700), 170), '');
check('cap of 0 = off', C.capGrams({mode:'g',val:0}, 9, 1700) === 0, '');

// ---- computeEntry: penalties ----
group('computeEntry — penalties & oil tax');
const PEN = {inflate:1.1, deduct:0.9, oilK:132, oilF:14};
const chk = {kcal:165, p:31, f:3.6, c:0};
(function(){
  const w = C.computeEntry('Chicken', 150, true, false, false, chk, 'DB', PEN);
  check('weighed 150g chicken: 247.5 kcal', approx(w.kcal, 247.5), `got ${w.kcal.toFixed(1)}`);
  check('weighed 150g chicken: 46.5g P', approx(w.p, 46.5), `got ${w.p.toFixed(1)}`);
  check('weighed entry carries no flags', w.flags.length === 0, '');

  const u = C.computeEntry('Chicken', 150, false, false, false, chk, 'DB', PEN);
  check('unweighed +10% kcal = 272.25', approx(u.kcal, 272.25), `got ${u.kcal.toFixed(2)}`);
  check('unweighed −10% P = 41.85', approx(u.p, 41.85), `got ${u.p.toFixed(2)}`);

  const cu = C.computeEntry('Curry', 150, false, true, false, chk, 'DB', PEN);
  check('unweighed curry adds 132 kcal oil tax', approx(cu.kcal, 272.25 + 132), `got ${cu.kcal.toFixed(2)}`);
  check('unweighed curry adds 14g fat', approx(cu.f, 3.6*1.5 + 14), `got ${cu.f.toFixed(2)}`);

  const half = C.computeEntry('Curry', 150, false, true, true, chk, 'DB', PEN);
  check('half oil tax adds 66 kcal', approx(half.kcal, 272.25 + 66), `got ${half.kcal.toFixed(2)}`);

  // Micronutrients scale with grams like the macros; a legacy base without them → 0, never NaN.
  const micBase = {kcal:100, p:5, f:2, c:10, fib:2, sug:5, na:400};
  const mic = C.computeEntry('x', 150, true, false, false, micBase, 'DB', PEN);
  check('micros scale at 150g: fib 3, sug 7.5, na 600', approx(mic.fib,3)&&approx(mic.sug,7.5)&&approx(mic.na,600), `got fib${mic.fib} sug${mic.sug} na${mic.na}`);
  const legacy = C.computeEntry('x', 150, true, false, false, {kcal:100,p:5,f:2,c:10}, 'DB', PEN);
  check('legacy base without micros → 0 (no NaN)', legacy.fib===0 && legacy.sug===0 && legacy.na===0, '');
})();

// ---- solveFridge ----
group('solveFridge — rice + chicken to floor');
const RICE = {kcal:130, p:2.7}, CHKf = {kcal:165, p:31};
const cfg = t => ({floor:1700, ceil:1900, pTarget:120, rice:RICE, chk:CHKf});
(function(){
  const s = C.solveFridge({kcal:1000, p:60}, cfg());
  check('exact-both solves (status ok)', s.status === 'ok', s.status);
  check('  → ~329g rice', approx(s.r, 329, 1), `got ${s.r.toFixed(1)}`);
  check('  → ~165g chicken', approx(s.k, 165, 1), `got ${s.k.toFixed(1)}`);
  check('  → protein lands ~120g', approx(s.vp, 120, 0.5), `got ${s.vp.toFixed(1)}`);

  const s2 = C.solveFridge({kcal:1000, p:115}, cfg());   // tiny protein gap ⇒ chicken-only branch
  check('chicken-only branch (rice=0)', s2.status === 'ok' && s2.r === 0, `r=${s2.r}`);
  check('  → ~424g chicken', approx(s2.k, 424, 1), `got ${s2.k.toFixed(1)}`);

  const s3 = C.solveFridge({kcal:1650, p:20}, cfg());     // small kcal gap, huge protein gap
  check('genuine conflict flagged', s3.status === 'conflict', s3.status);
  check('  → protein shortfall ~90.6g', approx(s3.shortfall, 90.6, 0.5), `got ${s3.shortfall.toFixed(1)}`);

  const s4 = C.solveFridge({kcal:1750, p:130}, cfg());    // already over floor
  check('floor already met → done', s4.status === 'done', s4.status);
})();

// ---- budgetCombos ----
group('budgetCombos — pair solver');
(function(){
  const foods = [['Chicken', {kcal:165,p:31}], ['Rice', {kcal:130,p:2.7}]];
  const combos = C.budgetCombos(foods, 500, 40);
  check('returns exactly one valid pair', combos.length === 1, `got ${combos.length}`);
  const c = combos[0];
  check('  → ~107g chicken', approx(c.gA, 107, 1), `got ${c.gA}`);
  check('  → ~248g rice', approx(c.gB, 248, 1), `got ${c.gB}`);
  check('  → lands ~500 kcal', approx(c.kcal, 500, 1), `got ${c.kcal}`);
  check('  → delivers ~40g protein', approx(c.p, 40, 1), `got ${c.p}`);
  check('  → not protein-penalised (score < 500)', c.score < 500, `score ${c.score.toFixed(1)}`);
})();

// ---- rankFoods: USDA candidate ranking ----
group('rankFoods — junk demotion, token boost, kcal plausibility');
(function(){
  const mk = (name,kcal)=>({name, base:{kcal, p:0, f:0, c:0}});
  // Junk demotion: dehydrated powder loses to the plain raw food even when USDA lists it first.
  const r1 = C.rankFoods([mk('Bananas, dehydrated, or banana powder',346), mk('Bananas, raw',89)], 'banana');
  check('raw banana beats dehydrated powder', r1[0].name==='Bananas, raw', `got ${r1[0].name}`);
  // Token boost: candidate containing every query word beats a keyword cousin.
  const r2 = C.rankFoods([mk('Wheat flour, whole-grain',340), mk('Wheat flour, white, all-purpose, enriched',364)], 'all purpose flour');
  check('all-query-words match outranks keyword cousin', r2[0].name.includes('all-purpose'), `got ${r2[0].name}`);
  // kcal plausibility: with an AI prior of ~880 kcal/100g, a 100 kcal "oil" sinks.
  const r3 = C.rankFoods([mk('Oil, plantain',100), mk('Oil, sunflower',884)], 'oil', 880);
  check('kcal prior sinks implausible candidate', r3[0].name==='Oil, sunflower', `got ${r3[0].name}`);
  // …but a mild deviation (165 vs est 200) must NOT override name quality.
  const r4 = C.rankFoods([mk('Chicken, breaded, fried',290), mk('Chicken, breast, raw',165)], 'chicken breast', 200);
  check('mild kcal deviation does not override name quality', r4[0].name==='Chicken, breast, raw', `got ${r4[0].name}`);
  // No prior + tied scores → USDA's original relevance order is preserved.
  const r5 = C.rankFoods([mk('Oil, plantain',100), mk('Oil, sunflower',884)], 'oil');
  check('no prior → USDA order kept on score tie', r5[0].name==='Oil, plantain', `got ${r5[0].name}`);
})();

// ---- defaultSelection: pick a plausible candidate, else fall back to the AI estimate ----
group('defaultSelection — reject a wrong top match, prefer the estimate');
(function(){
  const mk = (name,kcal)=>({name, base:{kcal, p:0, f:0, c:0}});
  // No candidates → the AI estimate is all we have.
  check('empty candidates → est', C.defaultSelection([], 250)==='est', 'expected est');
  // No prior → keep the top-ranked match (legacy behaviour).
  check('no prior → u0', C.defaultSelection([mk('Water',40)], 0)==='u0', 'expected u0');
  // Top match is plausible vs the prior → take it.
  check('plausible top → u0', C.defaultSelection([mk('Chapati',297), mk('Wheat flour',364)], 300)==='u0', 'expected u0');
  // Top match wildly off (chapati est ~300, top is a 40 kcal "water"), but a later
  // candidate lands near the prior → pick that candidate, not the wrong top one.
  check('wrong top, plausible later → that index',
    C.defaultSelection([mk('Water, bottled',40), mk('Chapati or roti',290)], 300)==='u1', 'expected u1');
  // Nothing lands near the prior → trust the AI estimate over a clearly-wrong match.
  check('no plausible candidate → est',
    C.defaultSelection([mk('Water',40), mk('Broth',12)], 300)==='est', 'expected est');
})();

// ---- fatEstimate: energy-balance body-fat change over a maintenance band ----
group('fatEstimate — 7700 kcal ≈ 1 kg, maintenance as a band');
(function(){
  const e = C.fatEstimate([3000,3000], 2200, 2400);
  check('n and sum', e.n===2 && e.sum===6000, `got n${e.n} sum${e.sum}`);
  check('low maintenance bound gives the larger surplus', e.kcalHigh===1600 && e.kcalLow===1200, `got ${e.kcalLow}..${e.kcalHigh}`);
  check('kg span = kcal / 7700', Math.abs(e.kgHigh-1600/7700)<1e-9 && Math.abs(e.kgLow-1200/7700)<1e-9, `got ${e.kgLow}..${e.kgHigh}`);
  // Deficit → negative (fat lost); bounds passed unordered must still resolve.
  const d = C.fatEstimate([1800,2000,1900], 2400, 2200);
  check('deficit yields negative kcal (fat lost)', d.kcalHigh===-900 && d.kcalLow===-1500, `got ${d.kcalLow}..${d.kcalHigh}`);
  const z = C.fatEstimate([], 2200, 2400);
  check('empty run → zeros', z.n===0 && z.sum===0 && z.kcalLow===0 && z.kcalHigh===0, `got n${z.n}`);
})();

// ---- bmrMifflin + calibrateTDEE: resting burn and adaptive maintenance ----
group('TDEE — Mifflin-St Jeor BMR and data calibration');
(function(){
  check('male 80kg/180cm/30y = 1780', C.bmrMifflin('male',80,180,30)===1780, `got ${C.bmrMifflin('male',80,180,30)}`);
  check('female 60kg/165cm/30y = 1320.25', approx(C.bmrMifflin('female',60,165,30),1320.25), `got ${C.bmrMifflin('female',60,165,30)}`);
  check('missing weight → 0', C.bmrMifflin('male',0,180,30)===0, '');
  check('moderate TDEE = BMR×1.55 = 2759', approx(C.bmrMifflin('male',80,180,30)*1.55,2759), '');
  // No usable weight trend → formula only.
  const c0 = C.calibrateTDEE(2400, 0, null, 0);
  check('no data → blended = formula 2400, dataTDEE null, w 0', c0.blended===2400 && c0.dataTDEE===null && c0.w===0, JSON.stringify(c0));
  // Losing 0.2 kg/wk at 2300 kcal ⇒ maintenance 2520; 28 days → fully calibrated.
  const c1 = C.calibrateTDEE(2400, 2300, -0.2, 28);
  check('full calibration (28d): dataTDEE 2520, w 1, blended 2520', c1.dataTDEE===2520 && c1.w===1 && c1.blended===2520, JSON.stringify(c1));
  // Gaining 0.1 kg/wk at 2500 ⇒ 2390; 17 days → half-weighted blend 2395.
  const c2 = C.calibrateTDEE(2400, 2500, 0.1, 17);
  check('half calibration (17d): dataTDEE 2390, blended 2395', c2.dataTDEE===2390 && approx(c2.w,10/21) && c2.blended===2395, JSON.stringify(c2));
  // Under 7 days of trend → formula only, no data lean yet.
  const c3 = C.calibrateTDEE(2400, 2300, -0.2, 5);
  check('below 7-day threshold → formula only', c3.blended===2400 && c3.dataTDEE===null, JSON.stringify(c3));

  // Corridor from TDEE + goal offset, rounded to nearest 25.
  const cor = C.corridorFromTDEE(2350, 300, 100);
  check('lean bulk +300 ±100 → 2550/2750, center 2650', cor.floor===2550 && cor.ceil===2750 && cor.center===2650, JSON.stringify(cor));
  const cor2 = C.corridorFromTDEE(2337, 300, 100);
  check('rounds to nearest 25 → 2525/2725', cor2.floor===2525 && cor2.ceil===2725, JSON.stringify(cor2));
  const cut = C.corridorFromTDEE(2350, -500, 100);
  check('cut −500 → 1750/1950', cut.floor===1750 && cut.ceil===1950, JSON.stringify(cut));
})();

// ---- mealPaceKcal + microStatus ----
group('mealPaceKcal — bracketed intake pace, and microStatus flags');
(function(){
  const meals=[{h:7.5,kcal:800},{h:11,kcal:200},{h:14,kcal:800},{h:16.5,kcal:300},{h:21,kcal:500}];
  check('before first meal → 0', C.mealPaceKcal(6, meals)===0, `got ${C.mealPaceKcal(6,meals)}`);
  check('breakfast ramp midpoint 07:30 → 400', C.mealPaceKcal(7.5, meals)===400, `got ${C.mealPaceKcal(7.5,meals)}`);
  check('after breakfast, before brunch 10:00 → 800', C.mealPaceKcal(10, meals)===800, `got ${C.mealPaceKcal(10,meals)}`);
  check('lunch midpoint 14:00 → 1400', C.mealPaceKcal(14, meals)===1400, `got ${C.mealPaceKcal(14,meals)}`);
  check('end of day → full 2600', C.mealPaceKcal(23, meals)===2600, `got ${C.mealPaceKcal(23,meals)}`);

  check('fiber 40/38 → ok', C.microStatus(40,38,false)==='ok', '');
  check('fiber 25/38 → low', C.microStatus(25,38,false)==='low', '');
  check('fiber 10/38 → verylow', C.microStatus(10,38,false)==='verylow', '');
  check('sodium 2500/2300 (limit) → over', C.microStatus(2500,2300,true)==='over', '');
  check('sodium 1900/2300 (limit) → near', C.microStatus(1900,2300,true)==='near', '');
  check('no target → na', C.microStatus(5,0,false)==='na', '');
})();

// ---- proteinFix: close a protein gap within a kcal budget ----
group('proteinFix — cheapest protein sources that fit');
(function(){
  const foods = [['Rice',{kcal:130,p:2.7}], ['Egg',{kcal:155,p:12.6}], ['Chicken',{kcal:165,p:31}]];
  const fix = C.proteinFix(foods, 30, 300);
  check('only realistic fits survive (chicken)', fix.length===1 && fix[0].name==='Chicken', `got ${fix.map(o=>o.name)}`);
  check('  → ~97g chicken', approx(fix[0].grams, 97, 1), `got ${fix[0].grams}`);
  check('  → ~160 kcal cost', approx(fix[0].kcal, 160, 1), `got ${fix[0].kcal}`);
  const fix2 = C.proteinFix(foods, 30, 400);
  check('bigger budget admits egg, chicken still first', fix2.length===2 && fix2[0].name==='Chicken' && fix2[1].name==='Egg', `got ${fix2.map(o=>o.name)}`);
  check('rice never qualifies (absurd grams)', !fix2.some(o=>o.name==='Rice'), '');
  check('no gap → no options', C.proteinFix(foods, 0, 400).length===0, '');
})();

// ---- weightTrend: kg/week least-squares fit ----
group('weightTrend — weekly rate from weigh-ins');
(function(){
  const w = C.weightTrend([{date:'2026-07-01',kg:80},{date:'2026-07-08',kg:79.5},{date:'2026-07-15',kg:79}]);
  check('perfect −0.5 kg/wk line', approx(w.ratePerWeek, -0.5, 0.001), `got ${w.ratePerWeek.toFixed(3)}`);
  check('  → latest = 79', w.latest===79, '');
  const g = C.weightTrend([{date:'2026-07-01',kg:70},{date:'2026-07-15',kg:70.6}]);
  check('gaining reads positive (+0.3/wk)', approx(g.ratePerWeek, 0.3, 0.001), `got ${g.ratePerWeek.toFixed(3)}`);
  check('single entry → null', C.weightTrend([{date:'2026-07-01',kg:80}])===null, '');
  check('same-day duplicates → null (no span)', C.weightTrend([{date:'2026-07-01',kg:80},{date:'2026-07-01',kg:81}])===null, '');
})();

// ---- mergeSyncStates: per-day last-write-wins ----
group('mergeSyncStates — day-level merge');
(function(){
  const A=[{name:'egg'}], B=[{name:'rice'}];
  // Disjoint days both survive.
  const m1 = LedgerCore.mergeSyncStates(
    {days:{'2026-07-13':A}, meta:{'2026-07-13':'t1'}},
    {days:{'2026-07-14':B}, meta:{'2026-07-14':'t2'}});
  check('disjoint days union', !!(m1.days['2026-07-13'] && m1.days['2026-07-14']), '');
  // Same day: newer stamp wins.
  const m2 = LedgerCore.mergeSyncStates(
    {days:{'2026-07-14':A}, meta:{'2026-07-14':'2026-07-14T10:00:00Z'}},
    {days:{'2026-07-14':B}, meta:{'2026-07-14':'2026-07-14T12:00:00Z'}});
  check('same day → newer editor wins', m2.days['2026-07-14'][0].name==='rice', `got ${m2.days['2026-07-14'][0].name}`);
  check('  → winning stamp kept', m2.meta['2026-07-14']==='2026-07-14T12:00:00Z', '');
  // Day with no stamp loses to a stamped edit.
  const m3 = LedgerCore.mergeSyncStates(
    {days:{'2026-07-14':A}, meta:{}},
    {days:{'2026-07-14':B}, meta:{'2026-07-14':'t'}});
  check('unstamped day loses to stamped', m3.days['2026-07-14'][0].name==='rice', '');
  // Newer stamp WITHOUT data falls back to the side that has the day.
  const m4 = LedgerCore.mergeSyncStates(
    {days:{'2026-07-14':A}, meta:{'2026-07-14':'t1'}},
    {days:{}, meta:{'2026-07-14':'t9'}});
  check('stale stamp without data does not drop the day', m4.days['2026-07-14'][0].name==='egg', '');
  // Cleared day (empty array) is data, not absence — it propagates.
  const m5 = LedgerCore.mergeSyncStates(
    {days:{'2026-07-14':[]}, meta:{'2026-07-14':'t9'}},
    {days:{'2026-07-14':B}, meta:{'2026-07-14':'t1'}});
  check('reset day propagates as empty', Array.isArray(m5.days['2026-07-14']) && m5.days['2026-07-14'].length===0, '');
})();

// ---- ternary math ----
group('ternary — barycentric plot');
(function(){
  const V = [[100,10],[10,180],[190,180]];
  const w = [0.2, 0.3, 0.5];
  const xy = T.cartesianFromBary(w, V);
  check('cartesianFromBary([.2,.3,.5]) = (118,146)', approx(xy[0],118) && approx(xy[1],146), `got ${xy}`);
  const back = T.baryFromCartesian(xy[0], xy[1], V);
  check('baryFromCartesian round-trips the weights',
    approx(back[0],0.2,1e-3) && approx(back[1],0.3,1e-3) && approx(back[2],0.5,1e-3), `got ${back.map(v=>v.toFixed(3))}`);

  const cl = T.clampBary([-0.4, 0.6, 0.8]);
  check('clampBary removes negatives & normalises to sum 1',
    cl[0]===0 && approx(cl[0]+cl[1]+cl[2], 1, 1e-9) && cl.every(v=>v>=0), `got ${cl.map(v=>v.toFixed(3))}`);

  // Meal example: chicken / rice / whole egg, 600 kcal budget, centre point.
  const foods = [{kcal:165,p:31,f:3.6,c:0},{kcal:130,p:2.7,f:0.3,c:28.2},{kcal:155,p:12.6,f:10.6,c:1.1}];
  const grams = T.baryToGrams([1/3,1/3,1/3], foods, 600);
  check('centre split → ~121g chicken', approx(grams[0],121.2,0.5), `got ${grams[0].toFixed(1)}`);
  check('centre split → ~154g rice', approx(grams[1],153.8,0.5), `got ${grams[1].toFixed(1)}`);
  const tot = T.totalsForGrams(grams, foods);
  check('kcal total equals the target (600)', approx(tot.kcal,600,0.5), `got ${tot.kcal.toFixed(1)}`);
  check('centre protein ≈ 58g', approx(tot.p,58,0.5), `got ${tot.p.toFixed(1)}`);

  const vp = T.vertexProteins(foods, 600);
  check('vertex protein (all chicken) ≈ 112.7g', approx(vp[0],112.7,0.5), `got ${vp[0].toFixed(1)}`);

  const TVe = [[120,20],[26,188],[214,188]];
  const cross = T.isoProteinCrossings(foods, 600, 60, TVe);
  check('iso-protein(60g) line crosses two edges', cross.length === 2, `got ${cross.length}`);
  const poly = T.greenPolygon(foods, 600, 60, TVe);
  check('green zone is a polygon (≥3 pts)', poly.length >= 3, `got ${poly.length}`);
  check('impossible protein → empty green zone', T.greenPolygon(foods, 600, 999, TVe).length === 0, '');
  check('already-met protein → full triangle green', T.greenPolygon(foods, 600, 0, TVe).length === 3, '');
})();

// ---- repairJson: salvaging a malformed model reply ----
group('repairJson — unbalanced / wrapped JSON');
(function(){
  // Verbatim capture from gemini-3.5-flash on this app's own prompt: a complete reply that
  // simply omits the outer closing brace (finishReason was STOP, not a length cutoff).
  const real = '{\n  "items": [\n    {\n      "name": "boiled egg",\n      "partOf": "",\n'
    + '      "grams": 100,\n      "weighed": false,\n      "isCurry": false,\n'
    + '      "est": {\n        "kcal": 155,\n        "p": 13.0,\n        "f": 11.0,\n        "c": 1.1\n      }\n    }\n  ]';
  check('real gemini-3.5-flash reply is NOT valid JSON', (()=>{ try{JSON.parse(real);return false;}catch(e){return true;} })(), 'missing final }');
  const fixed = C.repairJson(real);
  check('repairJson recovers it', !!fixed && fixed.items && fixed.items.length===1, '');
  check('recovered values are intact', fixed.items[0].name==='boiled egg' && fixed.items[0].est.kcal===155,
        `got ${fixed && fixed.items[0].name}`);

  check('valid JSON passes straight through',
        C.repairJson('{"items":[{"name":"rice"}]}').items[0].name === 'rice', '');
  check('strips prose before and after',
        C.repairJson('Here you go:\n{"items":[{"name":"rice"}]}\nHope that helps!').items[0].name === 'rice', '');
  check('closes a dropped array bracket AND brace',
        (C.repairJson('{"items":[{"name":"oats"}')||{}).items[0].name === 'oats', '');
  check('drops a dangling comma from a cut-off item',
        (C.repairJson('{"items":[{"name":"oats"},')||{}).items.length === 1, '');
  check('closes a reply cut mid-string',
        (C.repairJson('{"items":[{"name":"chick')||{}).items[0].name === 'chick', '');
  check('a brace inside a string is not counted as structure',
        C.repairJson('{"items":[{"name":"weird } [ name"}]}').items[0].name === 'weird } [ name', '');
  check('an escaped quote does not end the string',
        C.repairJson('{"items":[{"name":"6\\" sub"}]}').items[0].name === '6" sub', '');
  check('bare array reply is accepted', C.repairJson('[{"name":"rice"}]').length === 1, '');
  check('no JSON at all returns null', C.repairJson('I could not read that meal.') === null, '');
  check('non-string input returns null', C.repairJson(null) === null, '');
  check('unsalvageable garbage returns null', C.repairJson('{"a": @@@') === null, '');
})();

// ---- supplement cycles ----
group('supplementDue — fixed calendar parity');
(function(){
  const alt = {every:2, anchor:'2026-07-01', mode:'fixed'};
  check('anchor day is ON',            C.supplementDue(alt,'2026-07-01'), '');
  check('day after anchor is OFF',    !C.supplementDue(alt,'2026-07-02'), '');
  check('two days after is ON',        C.supplementDue(alt,'2026-07-03'), '');
  check('parity holds a month out',    C.supplementDue(alt,'2026-07-31'), '30 days on');
  check('and its neighbour is OFF',   !C.supplementDue(alt,'2026-08-01'), '');
  check('before the anchor = not started', !C.supplementDue(alt,'2026-06-30'), '');
  check('a missed dose does not shift parity',
        C.supplementDue(alt,'2026-07-05', '2026-07-04'), 'lastTaken is ignored in fixed mode');
  check('every:1 is daily',            C.supplementDue({every:1, anchor:'2026-07-01'},'2026-07-02'), '');
  check('every:3 hits day 3, not day 2',
        C.supplementDue({every:3, anchor:'2026-07-01'},'2026-07-04') &&
       !C.supplementDue({every:3, anchor:'2026-07-01'},'2026-07-03'), '');
})();

group('supplementDue — weekdays and rolling');
(function(){
  // 2026-07-01 is a Wednesday → Monday-first index 2.
  check('weekday index is Monday-first', C.isoWeekdayMon('2026-07-01') === 2, `got ${C.isoWeekdayMon('2026-07-01')}`);
  const mw = {days:[0,2]};                                  // Mon + Wed
  check('Wednesday is ON',   C.supplementDue(mw,'2026-07-01'), '');
  check('Thursday is OFF',  !C.supplementDue(mw,'2026-07-02'), '');
  check('Monday is ON',      C.supplementDue(mw,'2026-07-06'), '');

  const roll = {every:2, mode:'rolling'};
  check('rolling with no history is due now', C.supplementDue(roll,'2026-07-05', null), '');
  check('rolling: 1 day after a dose is OFF', !C.supplementDue(roll,'2026-07-05','2026-07-04'), '');
  check('rolling: 2 days after a dose is ON',  C.supplementDue(roll,'2026-07-06','2026-07-04'), '');
  check('rolling: overdue stays ON',          C.supplementDue(roll,'2026-07-09','2026-07-04'), '');
})();

group('supplementNextDue');
(function(){
  const alt = {every:2, anchor:'2026-07-01', mode:'fixed'};
  check('next ON day from an OFF day', C.supplementNextDue(alt,'2026-07-02') === '2026-07-03',
        `got ${C.supplementNextDue(alt,'2026-07-02')}`);
  check('an ON day is its own answer',  C.supplementNextDue(alt,'2026-07-03') === '2026-07-03', '');
  // An empty weekday list is not a "never" schedule — it falls through to the every-N
  // branch, where a missing `every` means daily. The add form rejects it before it lands.
  check('empty weekday set degrades to daily', C.supplementNextDue({days:[]},'2026-07-02') === '2026-07-02',
        `got ${C.supplementNextDue({days:[]},'2026-07-02')}`);
})();

group('supplementWindow + supplementStats');
(function(){
  const alt = {every:2, anchor:'2026-07-01', mode:'fixed'};
  // ON days in 1–7 July: 1,3,5,7. Took 1 and 3, missed 5, 7 is the open day on screen.
  const taken = {'2026-07-01':true, '2026-07-03':true};
  const cells = C.supplementWindow(alt, taken, '2026-07-07', 7);
  check('window is 7 cells ending on the view date',
        cells.length === 7 && cells[6].date === '2026-07-07', `got ${cells.length}`);
  check('marks the right days ON', cells.filter(c=>c.due).length === 4, `got ${cells.filter(c=>c.due).length}`);
  const st = C.supplementStats(cells);
  check('counts 4 due, 2 taken, 2 missed', st.due===4 && st.taken===2 && st.missed===2,
        `got due ${st.due}, taken ${st.taken}, missed ${st.missed}`);
  check('adherence rate is 50%', approx(st.rate, 0.5, 0.001), `got ${st.rate}`);

  // Perfect run whose final ON day is the still-open day on screen: it must not break the streak.
  const perfect = C.supplementWindow(alt, {'2026-07-01':true,'2026-07-03':true,'2026-07-05':true}, '2026-07-07', 7);
  check('open ON day is pending, not a miss', C.supplementStats(perfect).streak === 3,
        `got ${C.supplementStats(perfect).streak}`);
  // A genuine gap mid-window does break it.
  check('an unmet past ON day breaks the streak', st.streak === 0, `got ${st.streak}`);

  // A dose on an OFF day is extra credit, never adherence.
  const off = C.supplementWindow(alt, {'2026-07-02':true}, '2026-07-07', 7);
  const ost = C.supplementStats(off);
  check('off-schedule dose counts as extra', ost.extra===1 && ost.taken===0, `got extra ${ost.extra}, taken ${ost.taken}`);

  // Rolling: the walk must carry doses forward, so each dose re-phases the next ON day.
  // Jul 2 due (no history) and dosed → Jul 3 off, Jul 4 due again, Jul 5 still due (overdue).
  const rw = C.supplementWindow({every:2, mode:'rolling'}, {'2026-07-02':true}, '2026-07-05', 4);
  check('rolling window re-phases after a dose, and stays ON once overdue',
        rw[0].due && !rw[1].due && rw[2].due && rw[3].due,
        rw.map(c=>(c.due?'O':'.')).join(''));
  // A dose BEFORE the window still sets the phase at the strip's left edge.
  const seeded = C.supplementWindow({every:2, mode:'rolling'}, {'2026-07-04':true}, '2026-07-07', 3);
  check('seeds phase from a dose before the window', !seeded[0].due && seeded[1].due,
        seeded.map(c=>(c.due?'O':'.')).join(''));
})();

// ---- summary ----
const sum = document.getElementById('summary');
sum.className = failed === 0 ? 'allpass' : 'anyfail';
sum.textContent = failed === 0
  ? `✓ all ${passed} assertions passed — core math locked`
  : `✗ ${failed} of ${passed+failed} assertions FAILED`;
</script>
