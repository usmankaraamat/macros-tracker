name: test
on:
  push:
  pull_request:
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax
        run: |
          node --check core.js
          for f in js/*.js; do node --check "$f"; done
      - name: Core regression suite
        run: node scripts/run-core-tests.mjs
      - name: Lift plan calendar parser
        run: node scripts/test-liftplan.mjs
      - name: Service-worker cache contract
        # Compared with the state before this push, so a multi-commit push is
        # checked as a whole rather than only its last commit.
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/check-cache-version.mjs
